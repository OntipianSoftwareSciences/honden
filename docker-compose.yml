services:
  postgres:
    image: postgres:16
    container_name: honden-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-honden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-honden_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-honden}
    ports:
      - "5432:5432"
    volumes:
      - honden-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-honden} -d ${POSTGRES_DB:-honden}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: honden-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - honden-redis-data:/data
