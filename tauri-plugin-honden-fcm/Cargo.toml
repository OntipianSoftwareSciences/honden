[package]
name = "tauri-plugin-honden-fcm"
version = "0.1.0"
description = "Firebase Cloud Messaging support for HonDen on Android"
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-honden-fcm"

[lib]
name = "tauri_plugin_honden_fcm"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
