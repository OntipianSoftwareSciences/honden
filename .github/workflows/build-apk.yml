name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Rust stable with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v3 installed the removed "tools" package, which makes sdkmanager
          # exit 1. v4 skips that package. The license input must be a YAML
          # boolean ('yes' makes getBooleanInput throw before licenses are
          # accepted, so later sdkmanager installs fail).
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'

      - name: Install Android SDK packages and NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          # API 34 is the targetSdk; API 37 is the compileSdk for the generated app.
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "build-tools;37.0.0" "ndk;28.2.13676358"
          # API 37 is published as android-37.0. Try the flat id too, then alias the
          # installed platform so AGP finds the 'android-37' folder it expects.
          if ! sdkmanager --install "platforms;android-37"; then
            echo 'platforms;android-37 is not published; falling back to platforms;android-37.0'
          fi
          if [ ! -f "$SDK_ROOT/platforms/android-37/source.properties" ]; then
            sdkmanager --install "platforms;android-37.0"
            rm -rf "$SDK_ROOT/platforms/android-37"
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Tauri Android project
        run: npx tauri android init --ci

      - name: Patch generated Android SDK to compile 37 / target 34 / min 29
        run: |
          # tauri android init generates src-tauri/gen/android/app/build.gradle.kts.
          # Keep compileSdk at 37 (tauri-android needs >= 36) and hold targetSdk at 34.
          find src-tauri/gen/android -name '*.gradle.kts' -exec \
            sed -i -E \
              -e 's/(compileSdk[[:space:]]*=[[:space:]]*)[0-9]+/\137/' \
              -e 's/(targetSdk[[:space:]]*=[[:space:]]*)[0-9]+/\134/' {} +
          grep -R -nE 'compileSdk|targetSdk|minSdk' src-tauri/gen/android --include='*.gradle.kts'
          if ! grep -R -qE 'compileSdk[[:space:]]*=[[:space:]]*37' src-tauri/gen/android --include='*.gradle.kts'; then
            echo 'compileSdk is not 37' >&2
            exit 1
          fi
          if ! grep -R -qE 'targetSdk[[:space:]]*=[[:space:]]*34' src-tauri/gen/android --include='*.gradle.kts'; then
            echo 'targetSdk is not 34' >&2
            exit 1
          fi
          if grep -R -qE 'minSdk[[:space:]]*=[[:space:]]*([3-9][0-9]|[1-9][0-9]{2,})' src-tauri/gen/android --include='*.gradle.kts'; then
            echo 'minSdk is above 29; Quest 2 needs API 29 or lower' >&2
            exit 1
          fi

      - name: Install honey launcher icons into generated Android project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          # `tauri android init --ci` copies Tauri's bundled swirl mipmaps into
          # gen/android. It does not read src-tauri/icons, so overwrite every
          # launcher density with the honey icons committed in #101.
          src = Path('src-tauri/icons/android')
          res = Path('src-tauri/gen/android/app/src/main/res')

          densities = ('mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi')
          for density in densities:
              source_dir = src / f'mipmap-{density}'
              target_dir = res / f'mipmap-{density}'
              if not source_dir.is_dir():
                  raise SystemExit(f'missing honey icon directory: {source_dir}')
              target_dir.mkdir(parents=True, exist_ok=True)
              for icon in ('ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png'):
                  source = source_dir / icon
                  if not source.is_file():
                      raise SystemExit(f'missing honey icon: {source}')
                  shutil.copy2(source, target_dir / icon)

          adaptive_source = src / 'mipmap-anydpi-v26/ic_launcher.xml'
          adaptive_target = res / 'mipmap-anydpi-v26/ic_launcher.xml'
          adaptive_target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(adaptive_source, adaptive_target)

          background_source = src / 'values/ic_launcher_background.xml'
          background_target = res / 'values/ic_launcher_background.xml'
          background_target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(background_source, background_target)
          PY

      - name: Add Firebase FCM Android config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys
          from pathlib import Path

          raw = os.environ.get('GOOGLE_SERVICES_JSON', '')
          if not raw.strip():
              sys.exit('GOOGLE_SERVICES_JSON secret is missing; add the Firebase config in GitHub repo secrets.')

          candidates = [raw]
          start, end = raw.find('{'), raw.rfind('}')
          if start >= 0 and end > start:
              candidates.append(raw[start:end + 1])
          try:
              candidates.append(base64.b64decode(raw.strip(), validate=True).decode('utf-8'))
          except Exception:
              pass

          for text in candidates:
              try:
                  config = json.loads(text)
              except Exception:
                  continue
              application_id = json.loads(Path('src-tauri/tauri.conf.json').read_text())['identifier']
              clients = config.get('client', [])

              def package_name(client):
                  return client.get('client_info', {}).get('android_client_info', {}).get('package_name')

              if not any(package_name(client) == application_id for client in clients):
                  sys.exit(
                      f'GOOGLE_SERVICES_JSON has no Firebase client for Android applicationId '
                      f'{application_id}; add that package in Firebase and update the secret.'
                  )
              Path('src-tauri/gen/android/app/google-services.json').write_text(
                  json.dumps(config, indent=2)
              )
              print('Firebase config validated; wrote google-services.json')
              break
          else:
              sys.exit(
                  'GOOGLE_SERVICES_JSON is not valid JSON. Re-add the exact raw contents of '
                  'google-services.json as the GitHub repo secret (no notes, backticks, or redactions).'
              )
          PY

      - name: Patch generated Android project for native incoming calls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Keep the theme Tauri generated for this app instead of guessing its
          # styled name; the rest of the manifest comes from our template.
          manifest = Path('src-tauri/gen/android/app/src/main/AndroidManifest.xml')
          generated = manifest.read_text()
          template = Path('src-tauri/android/AndroidManifest.xml').read_text()
          theme = re.search(r'android:theme="@style/([^"]+)"', generated)
          if theme:
              template = template.replace(
                  '@style/Theme.honden', f'@style/{theme.group(1)}', 1
              )
          manifest.write_text(template)

          root = Path('src-tauri/gen/android/build.gradle.kts')
          text = root.read_text()
          kotlin = re.search(
              r'^[ \t]*classpath\("org\.jetbrains\.kotlin:kotlin-gradle-plugin:[^"]+"\)[ \t]*$',
              text,
              re.M,
          )
          if not kotlin:
              raise SystemExit('root Gradle Kotlin classpath marker not found')
          insert_at = kotlin.end()
          text = (
              text[:insert_at]
              + '\n        classpath("com.google.gms:google-services:4.6.0")'
              + text[insert_at:]
          )
          root.write_text(text)

          app = Path('src-tauri/gen/android/app/build.gradle.kts')
          text = app.read_text()
          plugin_marker = '    id("rust")'
          if plugin_marker not in text:
              raise SystemExit('app Gradle rust plugin marker not found')
          text = text.replace(
              plugin_marker,
              plugin_marker + '\n    id("com.google.gms.google-services")',
              1,
          )
          webkit = re.search(
              r'^[ \t]*implementation\("androidx\.webkit:webkit:[^"]+"\)[ \t]*$',
              text,
              re.M,
          )
          if not webkit:
              raise SystemExit('app Gradle dependency marker not found')
          insert_at = webkit.start()
          text = (
              text[:insert_at]
              + '    implementation(platform("com.google.firebase:firebase-bom:35.2.0"))\n'
              + '    implementation("com.google.firebase:firebase-messaging")\n'
              + text[insert_at:]
          )
          app.write_text(text)
          PY

      - name: Build ARM64 APK
        run: npx tauri android build --apk --target aarch64

      - name: Verify universal ARM64 APK
        run: |
          mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk')
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo 'No APK was produced' >&2
            exit 1
          fi
          APK=''
          BEST_SIZE=0
          for CANDIDATE in "${APKS[@]}"; do
            if unzip -l "$CANDIDATE" | grep -qE 'lib/(armeabi-v7a|x86|x86_64)/'; then
              continue
            fi
            if ! unzip -l "$CANDIDATE" | grep -q 'lib/arm64-v8a/'; then
              continue
            fi
            SIZE=$(stat -c%s "$CANDIDATE")
            if [ "$SIZE" -gt "$BEST_SIZE" ]; then
              APK="$CANDIDATE"
              BEST_SIZE="$SIZE"
            fi
          done
          if [ -z "$APK" ]; then
            echo 'No single universal ARM64 APK was produced' >&2
            printf '%s\n' "${APKS[@]}" >&2
            exit 1
          fi
          echo "Using universal ARM64 APK: $APK"
          unzip -l "$APK" | grep -E 'lib/[a-zA-Z0-9_-]+/' | sort -u || true
          cp "$APK" honden.apk

      - name: Sign release APK
        run: |
          # Stable self-signed release key (committed as base64 so rebuilds keep the
          # same signing identity and can upgrade installed copies).
          base64 -d src-tauri/android-release.jks.b64 > "$RUNNER_TEMP/honden-release.jks"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/honden-release.jks" \
            --ks-pass pass:honden2026 \
            --key-pass pass:honden2026 \
            --ks-key-alias honden \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out honden-signed.apk honden.apk
          "$APKSIGNER" verify --verbose --print-certs honden-signed.apk
          mv honden-signed.apk honden.apk

      - name: Publish APK for browser download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest honden.apk --clobber
          else
            gh release create apk-latest honden.apk \
              --title "HonDen Android APK" \
              --notes "Latest single universal ARM64 APK for Galaxy S21 and Meta Quest 2."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HonDen-ARM64-APK
          path: honden.apk
          if-no-files-found: error
