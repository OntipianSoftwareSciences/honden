name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Rust stable with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v3 installed the removed "tools" package, which makes sdkmanager
          # exit 1. v4 skips that package. The license input must be a YAML
          # boolean ('yes' makes getBooleanInput throw before licenses are
          # accepted, so later sdkmanager installs fail).
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'

      - name: Install Android SDK packages and NDK
        run: |
          # Install SDK 34 for the pinned compileSdk/targetSdk in the patch step below.
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;28.2.13676358"
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Tauri Android project
        run: npx tauri android init --ci

      - name: Set generated Android SDK target to 34
        run: |
          find src-tauri/gen/android -name '*.gradle.kts' -exec \
            sed -i -E 's/(compileSdk[[:space:]]*=[[:space:]]*)37/\134/; s/(targetSdk[[:space:]]*=[[:space:]]*)37/\134/' {} +
          grep -R -nE 'compileSdk|targetSdk' src-tauri/gen/android --include='*.gradle.kts'

      - name: Build ARM64 APK
        run: npx tauri android build --apk --target aarch64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HonDen-GalaxyS21-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
