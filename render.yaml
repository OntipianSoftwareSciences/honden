services:
  - type: web
    name: honden
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: DATABASE_URL
        fromDatabase:
          name: honden-db
          property: connectionString
      # Generate these locally with `npm run vapid:keys`; set the values in the
      # Render dashboard. Never put the private key in chat or in the repo.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

databases:
  - name: honden-db
    plan: free
