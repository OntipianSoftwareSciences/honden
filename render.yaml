services:
  - type: web
    name: honden
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: DATABASE_URL
        fromDatabase:
          name: honden-db
          property: connectionString

databases:
  - name: honden-db
    plan: free
