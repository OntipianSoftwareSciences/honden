[package]
name = "honden"
version = "0.1.0"
description = "HonDen - a sweet, safe den to talk in"
authors = ["HonDen"]
edition = "2021"

[lib]
name = "honden_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2.8.1"
tauri-plugin-honden-fcm = { path = "../tauri-plugin-honden-fcm" }
tauri-plugin-deep-link = "2"
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
